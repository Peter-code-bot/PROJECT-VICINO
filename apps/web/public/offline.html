<!doctype html>
<!--
  Pagina que el SERVICE WORKER sirve cuando una navegacion falla por red (abrir la app
  o recargar sin conexion). La devuelve el handlerDidError de la regla "pages" de
  next.config.ts: el SW la guarda en el precache al instalarse y la sirve en lugar de
  la pagina pedida, con la misma URL en la barra.

  Es la hermana de dist/offline.html, NO un duplicado por descuido: aquella la sirve
  Capacitor desde los assets del APK (server.errorPath) y solo aparece cuando no hay
  service worker que conteste — primer arranque sin red, o tras borrar los datos de la
  app. Con el SW instalado, el WebView NO avisa a Capacitor del fallo y errorPath no
  salta nunca (demostrado el 19-oct-2026, docs/ANDROID-SIN-RED-2026-10-19.md).
  Diseno y textos IGUALES en las dos: si se cambia una, se cambia la otra.

  Diferencias con dist/offline.html, y por que:
  - Reintentar recarga la URL que fallo, en vez de saltar al home: aqui seguimos en
    https://vicinomarket.com/<lo que fuera>, no en https://localhost/offline.html.
  - Quita el splash: servida por el SW en el origen de la app, el puente de Capacitor
    SI esta inyectado. Sin esto el splash la tapa hasta su techo de 15 s.
  - noindex: esta en el sitio publico y no debe salir en buscadores.

  - Autocontenida: sin fuentes, scripts ni imagenes externas, ni chunks de Next, porque
    se muestra justo cuando no hay red y tiene que sobrevivir a cualquier deploy.
  - proxy.ts la excluye de su matcher. Si no, a un invitado se le redirige a /login y el
    SW guardaria la pagina de login como pagina sin red.
  - Texto y diseno PROVISIONALES: pendientes de revision de Javier. Colores = tokens
    del tema claro de app/globals.css (--bg, --fg, --fg-muted, --brand-base).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="robots" content="noindex">
  <title>VICINO sin conexión</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #FFF8F0; color: #1A1A2E;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    main { max-width: 360px; }
    .marca { color: #1A1A2E; font-weight: 800; font-size: 28px; letter-spacing: .02em; margin: 0 0 32px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #5C6360; font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
    button {
      min-height: 48px; min-width: 160px; padding: 0 24px; border: 0; border-radius: 999px;
      background: #1F5A4E; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 16px;
    }
    button:focus-visible { outline: 3px solid #1A1A2E; outline-offset: 3px; }
    button[disabled] { opacity: .6; }
  </style>
</head>
<body>
  <main>
    <p class="marca" aria-hidden="true">VICINO</p>
    <h1>Sin conexión</h1>
    <p id="mensaje" role="status">No pudimos abrir VICINO. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button id="reintentar" type="button">Reintentar</button>
  </main>
  <script>
    (function () {
      var boton = document.getElementById("reintentar");
      var mensaje = document.getElementById("mensaje");
      var TEXTO = mensaje.textContent;
      var restaurar = null;
      // En la app el splash nativo sigue encima: la web que lo quita (capacitor-init)
      // no llego a cargar. nativePromise es del puente que Capacitor inyecta en el
      // origen de la app; en un navegador no existe y esto no hace nada. Si falla, el
      // splash se va solo al llegar a su techo (launchShowDuration).
      try {
        var cap = window.Capacitor;
        if (cap && typeof cap.nativePromise === "function") {
          cap.nativePromise("SplashScreen", "hide", {}).catch(function () {});
        }
      } catch (e) {}
      function reintentar() {
        if (boton.disabled) return;
        boton.disabled = true;
        mensaje.textContent = "Conectando…";
        // Si la navegacion se cuelga (portal cautivo, red que no responde) y nunca
        // llega a fallar ni a cargar, el boton no puede quedarse muerto.
        clearTimeout(restaurar);
        restaurar = setTimeout(function () {
          boton.disabled = false;
          mensaje.textContent = TEXTO;
        }, 10000);
        // Abierta a mano en /offline.html no hay nada que reintentar: al home.
        // Si no, se recarga la URL que fallo. reload() y no replace(location.href):
        // con un #ancla, replace a la misma URL solo hace scroll y no vuelve a pedir nada.
        if (location.pathname === "/offline.html") {
          window.location.replace("/");
        } else {
          window.location.reload();
        }
      }
      boton.addEventListener("click", reintentar);
      // Al volver la red se reintenta solo. Si la red "vuelve" pero no funciona, la
      // navegacion falla, el SW trae de nuevo esta pagina y no hay bucle: el evento
      // online no se repite hasta el siguiente cambio real de red.
      window.addEventListener("online", reintentar);
    })();
  </script>
</body>
</html>
