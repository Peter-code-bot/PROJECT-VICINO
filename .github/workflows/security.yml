name: Security Audit

on:
  pull_request:
    branches: [master, design]
  push:
    branches: [master]

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high

  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El guard de stubs TODO ya esta encadenado al build (package.json:7),
      # pero eso solo dispara en Vercel, o sea DESPUES del push a master. Aqui
      # se adelanta al PR reutilizando el checkout y el install de este job,
      # sin anadir un job ni un build completo.
      - name: Guard de stubs TODO
        run: cd apps/web && node scripts/check-no-todo.mjs

      # Un href a una ruta que no existe es un 404 en la cara del usuario, y no
      # lo atrapa ni tsc ni el build de Next. Ya pasó tres veces: /ingresar,
      # /registro, /producto/<id> y /resenar/<id>, dos de ellas en los únicos
      # botones que el home ofrece a quien no tiene sesión.
      - name: Guard de rutas enlazadas
        run: node scripts/check-rutas.mjs

      - name: Type check
        run: cd apps/web && pnpm type-check

      # Lint no estaba en ningun job, asi que sus errores no los miraba nadie.
      # Llevaba 27, y el dia que se revisaron ninguno era un bug: doce `any` que
      # tapaban contratos (uno escondia un `.eq("id", undefined)` que llevaba
      # meses sin actualizar una sola fila), once setState dentro de efectos que
      # son patrones correctos, y cuatro cosmeticos.
      #
      # Se anade AHORA y no antes porque una compuerta que nace en rojo no es
      # una compuerta: es ruido que se aprende a ignorar, y entonces deja de
      # avisar el dia que tiene razon. Eso ya paso aqui con `npm audit`, que
      # llevaba quince pushes en rojo por un `tar` que solo vive en
      # herramientas de build mientras cuatro fallos HIGH de Next -- dos SSRF y
      # un DoS por Server Actions, con veinte archivos usandolas -- viajaban en
      # ese mismo informe sin que nadie los viera.
      #
      # Los 161 avisos que quedan NO rompen el job, a proposito: son deuda
      # visible, no una alarma. Si algun dia se limpian, esto puede pasar a
      # --max-warnings=0.
      - name: Lint
        run: cd apps/web && pnpm lint

  # Nadie vigilaba si apps/web/types/database.types.ts seguia describiendo el
  # esquema real. Llevaba meses sin regenerarse — le faltaba sort_order, entre
  # otras — y ademas no lo importaba nadie, asi que eran 100 KB que aparentaban
  # vigilancia del esquema sin darla.
  #
  # NO bloquea a proposito. Las migraciones se aplican a mano con
  # `supabase db push`, asi que entre que se mergea una migracion y se aplica hay
  # una ventana en la que la divergencia es CORRECTA. Un fallo duro ahi seria
  # ruido, y el ruido acaba en "ignora ese check en rojo", que es peor que no
  # tenerlo.
  #
  # Corre solo en master: en un PR la divergencia casi siempre es legitima.
  schema-drift:
    name: Deriva de tipos vs produccion
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sin el secreto el trabajo no puede comprobar nada. Se avisa en voz alta
      # en vez de pasar en verde: un check que aprueba sin mirar es exactamente
      # el fallo silencioso que este trabajo viene a evitar.
      - name: Comprobar que hay credencial
        id: credencial
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning title=Deriva de tipos sin comprobar::Falta el secreto SUPABASE_ACCESS_TOKEN, asi que este trabajo NO comprobo nada. Anadelo en Settings > Secrets and variables > Actions."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Comparar tipos con el esquema de produccion
        if: steps.credencial.outputs.hay == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! node scripts/gen-types.mjs --check; then
            echo "::warning title=Tipos desfasados::apps/web/types/database.types.ts no coincide con el esquema de produccion. Corre: node scripts/gen-types.mjs"
          fi

      # Las versiones legales viven en DOS sitios desde que existe la tabla
      # legal_documents: la constante de packages/shared y la fila de la base.
      # La pagina muestra la constante y el registro guarda la fila, asi que si
      # se separan se le ensena a la persona una version y se le registra otra
      # — y un registro que no coincide con lo que se mostro no acredita nada.
      # Ninguna restriccion de la base puede vigilar el codigo, asi que se
      # vigila aqui. Este SI es error y no aviso: no hay divergencia legitima.
      - name: Comprobar versiones legales contra produccion
        if: steps.credencial.outputs.hay == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-legal-versions.mjs
