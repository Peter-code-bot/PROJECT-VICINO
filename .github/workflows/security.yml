name: Security Audit

on:
  pull_request:
    branches: [master, design]
  push:
    branches: [master]

jobs:
  # Nada detecto la fuga de julio, cuando una clave service_role entro al repo
  # en 8416eee dentro de cuatro scripts de comprobacion. Ahi sigue: borrarla del
  # arbol en 9a88580 la saco del working tree, no del historial. Y nada habria
  # detectado la siguiente tampoco.
  #
  # ESTE JOB MIRA LOS COMMITS NUEVOS, NO TODO EL HISTORIAL, y es deliberado.
  #
  # Escanear el historial completo lo dejaria en rojo permanente por 8416eee
  # hasta que la clave este rotada y las legacy apagadas. Un rojo que no se
  # puede apagar con el trabajo del dia deja de leerse en una semana, y
  # entonces no avisa el dia que tiene razon. En este mismo repo ya paso: el
  # job de npm audit llevaba quince pushes en rojo por un `tar` de herramientas
  # de build, y por debajo viajaban cuatro fallos HIGH de Next -- dos SSRF y un
  # DoS -- que nadie miro.
  #
  # La fuga historica NO queda perdonada: esta documentada en
  # docs/RUNBOOK-claves-filtradas.md con los siete pasos para cerrarla, y sigue
  # abierta hasta que se hagan. Lo que este job impide es la SIGUIENTE, que es
  # justo lo que no habia. Y si alguien reintroduce esa misma clave en un
  # commit nuevo, la caza igual, porque ese commit si esta en el rango.
  #
  # Binario y no gitleaks-action: este repo es privado y la accion pide
  # licencia; el binario es MIT.
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Determinar el rango a escanear
        id: rango
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DESDE="${{ github.event.pull_request.base.sha }}"
          else
            DESDE="${{ github.event.before }}"
          fi
          # En el primer push de una rama, github.event.before son todo ceros y
          # no existe como commit. Ahi se escanea solo el commit de cabeza: es
          # el unico rango que tiene sentido y no falla.
          if [ -z "$DESDE" ] || [ "$DESDE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$DESDE^{commit}" 2>/dev/null; then
            echo "opts=--no-merges -1 ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "opts=--no-merges $DESDE..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar secretos en los commits nuevos
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1 \
            --log-opts="${{ steps.rango.outputs.opts }}"

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        # pnpm 9 sigue fijado para install/build. Su endpoint de audit fue
        # retirado por npm; usar el cliente oficial 11 solo para esta lectura.
        # "with current" impide volver automaticamente al packageManager 9.
        run: |
          npx --yes --package=pnpm@11.0.0 pnpm with current --version
          npx --yes --package=pnpm@11.0.0 pnpm with current audit --audit-level=high
          git diff --exit-code -- pnpm-lock.yaml package.json pnpm-workspace.yaml

  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El guard de stubs TODO ya esta encadenado al build (package.json:7),
      # pero eso solo dispara en Vercel, o sea DESPUES del push a master. Aqui
      # se adelanta al PR reutilizando el checkout y el install de este job,
      # sin anadir un job ni un build completo.
      - name: Guard de stubs TODO
        run: cd apps/web && node scripts/check-no-todo.mjs

      # Un href a una ruta que no existe es un 404 en la cara del usuario, y no
      # lo atrapa ni tsc ni el build de Next. Ya pasó tres veces: /ingresar,
      # /registro, /producto/<id> y /resenar/<id>, dos de ellas en los únicos
      # botones que el home ofrece a quien no tiene sesión.
      - name: Guard de rutas enlazadas
        run: node scripts/check-rutas.mjs

      - name: Type check
        run: cd apps/web && pnpm type-check

      - name: Validacion y guardado de campos opcionales
        run: |
          pnpm exec tsx scripts/test-product-validator.ts
          node scripts/test-product-optional-actions.cjs

      - name: Regresiones de validacion y verificacion de identidad
        run: pnpm exec tsx --test scripts/test-zod-upgrade.ts scripts/test-veredicto-verificacion.ts

      - name: Contrato de confirmacion de venta y precio fijo
        run: |
          pnpm exec tsx --test scripts/test-precio-confirmacion.ts scripts/test-s04b-server.ts
          pnpm exec tsx scripts/test-venta-chat-sql.ts

      # Las pruebas de lealtad existen desde el PR #76 y ningun job las corria:
      # una regresion del motor no le habria avisado a nadie. Ninguno de los dos
      # scripts es node:test; cada uno sale distinto de 0 al primer fallo. Las
      # de lib/wallet corren en el paso siguiente, con el resto de apps/web.
      #
      # Hueco conocido, sin prueba todavia: "venta confirmada con las RPC del
      # 23/24-oct -> sello". test-lealtad-sql.ts solo aplica la migracion
      # 20260320000007 de sale_confirmations, y test-venta-chat-sql.ts no
      # aplica la de lealtad.
      - name: Motor y validadores de lealtad
        run: |
          pnpm exec tsx scripts/test-lealtad-validadores.ts
          pnpm exec tsx scripts/test-lealtad-sql.ts

      # La suite unitaria de apps/web, la misma que se corre antes de cada push
      # (apps/web/lib/pruebas/cargar-real.ts). La lista sale de git y no de un
      # glob, a proposito: `lib/**/*.test.ts` deja fuera archivos en bash sin
      # globstar (`**` vale un solo nivel) y en git (exige una subcarpeta), y
      # Node 22 con un glob sin coincidencias corre 0 pruebas y sale con 0.
      # Una CI que corre menos pruebas sin avisar es un verde que no mira. Por
      # eso falla si la lista sale vacia e imprime cuantas corre. Si alguna vez
      # hay que excluir una, que sea con pathspec explicito y comentado
      # (':!:ruta'), nunca cambiando el patron.
      #
      # Pasarle a Node la lista tal cual tampoco basta: Node 22 vuelve a leer
      # CADA argumento de --test como glob y, si otro argumento si coincide,
      # descarta sin avisar el que no. Una prueba bajo una carpeta dinamica de
      # Next ([id], [...slug]) no correria nunca, ni una con nombre no ASCII,
      # que git devuelve entre comillas. Por eso la lista se lee con -z (rutas
      # tal cual, sin comillas), cada metacaracter de glob va en una clase de
      # un solo caracter ([id] -> [[]id[]]) y, antes de correr, el mismo glob
      # de Node (fs.globSync) confirma que cada patron da exactamente un
      # archivo. Lo que el escape no cubra (p. ej. llaves con coma, que el glob
      # expande antes de mirar las clases) falla aqui en voz alta en vez de
      # saltarse.
      #
      # openssl se exige porque sin el la prueba de firma del .pkpass
      # (lib/wallet/apple/pase.test.ts) se OMITE en vez de fallar.
      - name: Pruebas unitarias de apps/web
        working-directory: apps/web
        shell: bash
        run: |
          openssl version
          mapfile -d '' -t archivos < <(git ls-files -z '*.test.ts')
          if [ "${#archivos[@]}" -eq 0 ]; then
            echo "::error title=Sin pruebas::git ls-files no encontro ningun *.test.ts en apps/web"
            exit 1
          fi
          patrones=()
          for ruta in "${archivos[@]}"; do
            patrones+=("$(printf '%s' "$ruta" | sed 's/[][*?{}()]/[&]/g')")
          done
          node -e '
            const { globSync } = require("node:fs");
            const malos = process.argv.slice(1)
              .map((patron) => [patron, globSync(patron).length])
              .filter(([, n]) => n !== 1);
            for (const [patron, n] of malos) {
              console.log(`::error title=Prueba que Node no correria::${patron} da ${n} archivos en el glob de Node, no 1`);
            }
            process.exit(malos.length > 0 ? 1 : 0);
          ' -- "${patrones[@]}"
          echo "Archivos de prueba: ${#patrones[@]}"
          node --import tsx --test "${patrones[@]}"

      # Lint no estaba en ningun job, asi que sus errores no los miraba nadie.
      # Llevaba 27, y el dia que se revisaron ninguno era un bug: doce `any` que
      # tapaban contratos (uno escondia un `.eq("id", undefined)` que llevaba
      # meses sin actualizar una sola fila), once setState dentro de efectos que
      # son patrones correctos, y cuatro cosmeticos.
      #
      # Se anade AHORA y no antes porque una compuerta que nace en rojo no es
      # una compuerta: es ruido que se aprende a ignorar, y entonces deja de
      # avisar el dia que tiene razon. Eso ya paso aqui con `npm audit`, que
      # llevaba quince pushes en rojo por un `tar` que solo vive en
      # herramientas de build mientras cuatro fallos HIGH de Next -- dos SSRF y
      # un DoS por Server Actions, con veinte archivos usandolas -- viajaban en
      # ese mismo informe sin que nadie los viera.
      #
      # Los 161 avisos que quedan NO rompen el job, a proposito: son deuda
      # visible, no una alarma. Si algun dia se limpian, esto puede pasar a
      # --max-warnings=0.
      - name: Lint
        run: cd apps/web && pnpm lint

  # Nadie vigilaba si apps/web/types/database.types.ts seguia describiendo el
  # esquema real. Llevaba meses sin regenerarse — le faltaba sort_order, entre
  # otras — y ademas no lo importaba nadie, asi que eran 100 KB que aparentaban
  # vigilancia del esquema sin darla.
  #
  # NO bloquea a proposito. Las migraciones se aplican a mano con
  # `supabase db push`, asi que entre que se mergea una migracion y se aplica hay
  # una ventana en la que la divergencia es CORRECTA. Un fallo duro ahi seria
  # ruido, y el ruido acaba en "ignora ese check en rojo", que es peor que no
  # tenerlo.
  #
  # Corre solo en master: en un PR la divergencia casi siempre es legitima.
  schema-drift:
    name: Deriva de tipos vs produccion
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sin el secreto el trabajo no puede comprobar nada. Se avisa en voz alta
      # en vez de pasar en verde: un check que aprueba sin mirar es exactamente
      # el fallo silencioso que este trabajo viene a evitar.
      - name: Comprobar que hay credencial
        id: credencial
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning title=Deriva de tipos sin comprobar::Falta el secreto SUPABASE_ACCESS_TOKEN, asi que este trabajo NO comprobo nada. Anadelo en Settings > Secrets and variables > Actions."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Comparar tipos con el esquema de produccion
        if: steps.credencial.outputs.hay == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! node scripts/gen-types.mjs --check; then
            echo "::warning title=Tipos desfasados::apps/web/types/database.types.ts no coincide con el esquema de produccion. Corre: node scripts/gen-types.mjs"
          fi

      # Las versiones legales viven en DOS sitios desde que existe la tabla
      # legal_documents: la constante de packages/shared y la fila de la base.
      # La pagina muestra la constante y el registro guarda la fila, asi que si
      # se separan se le ensena a la persona una version y se le registra otra
      # — y un registro que no coincide con lo que se mostro no acredita nada.
      # Ninguna restriccion de la base puede vigilar el codigo, asi que se
      # vigila aqui. Este SI es error y no aviso: no hay divergencia legitima.
      - name: Comprobar versiones legales contra produccion
        if: steps.credencial.outputs.hay == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-legal-versions.mjs
