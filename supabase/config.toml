[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "20MB"

[realtime]
enabled = true

# Invocada por pg_cron vía pg_net, no por un usuario. El header que llega es
# `Bearer <cron_secret>`, que NO es un JWT de Supabase: con verify_jwt = true el
# gateway devuelve 401 antes de entrar a la función y el chequeo de CRON_SECRET
# de index.ts nunca corre. La autenticación real es ese bearer compartido,
# igual que en expire-confirmations y send-appointment-reminders.
[functions.purge-verification-documents]
verify_jwt = false

# Mismo caso que purge-verification-documents: las dispara pg_cron vía pg_net
# (20260531000001_pg_cron_schedules.sql) con `Bearer <cron_secret>`, que no es
# un JWT de Supabase. Estaban en verify_jwt = false en el servidor pero sin
# respaldo aquí, así que un deploy sin estas entradas las flipeaba al default
# del CLI (true) y el gateway habría devuelto 401 antes de entrar a la función.
[functions.expire-confirmations]
verify_jwt = false

[functions.send-appointment-reminders]
verify_jwt = false
